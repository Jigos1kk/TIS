services:
  tis-postgres:
    image: postgres:15-alpine
    container_name: tis-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tis-postgres-data:/var/lib/postgresql/data
    networks:
      - tis-nat-network
    ports:
      - "5432:5432" 

  tis-adminer:
    image: adminer:latest
    container_name: tis-adminer
    restart: always
    ports:
      - "12405:8080"
    environment:
      ADMINER_DEFAULT_SERVER: tis-postgres 
    depends_on:
      - tis-postgres
    networks:
      - tis-nat-network

volumes:
  tis-postgres-data:

networks:
  tis-nat-network:
    driver: bridge